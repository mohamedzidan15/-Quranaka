name: Build Quranak v6 Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Quranak_Complete_App_v6 (1).zip'
      - 'images.zip'
      - 'adhan.mp3'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quranaka-v6-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prepare, analyze and build Quranak v6
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Restore v6 source and complete Android project
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/quranak-v6"
          mkdir -p "$WORK"
          unzip -q "Quranak_Complete_App_v6 (1).zip" -d "$WORK"
          PROJECT="$WORK/Quranak_Complete_App_v6/quranak_flutter_app"

          test -s "$PROJECT/pubspec.yaml"
          test -s "$PROJECT/lib/main.dart"
          test -s "$PROJECT/android/app/google-services.json"
          test -s "$PROJECT/android/app/src/main/AndroidManifest.xml"
          test -s "$PROJECT/assets/audio/adhan.mp3"
          test -s "images.zip"

          mkdir -p "$PROJECT/assets/images"
          unzip -oq images.zip -d "$PROJECT/assets/images"
          mkdir -p "$PROJECT/android/app/src/main/res/raw"
          cp "$PROJECT/assets/audio/adhan.mp3" "$PROJECT/android/app/src/main/res/raw/adhan.mp3"

          # Preserve the exact v6 application source and manifest while generating missing Gradle scaffolding.
          cp "$PROJECT/lib/main.dart" "$WORK/main.dart"
          cp "$PROJECT/pubspec.yaml" "$WORK/pubspec.yaml"
          cp "$PROJECT/android/app/src/main/AndroidManifest.xml" "$WORK/AndroidManifest.xml"
          cp "$PROJECT/android/app/google-services.json" "$WORK/google-services.json"
          cd "$PROJECT"
          flutter create --platforms=android --org com.quranak --project-name app --overwrite .
          cp "$WORK/main.dart" lib/main.dart
          cp "$WORK/pubspec.yaml" pubspec.yaml
          cp "$WORK/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          cp "$WORK/google-services.json" android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")
          app = Path("android/app/build.gradle")
          if not settings.is_file() or not app.is_file():
              raise SystemExit("Flutter Android Gradle scaffold was not generated.")

          s = settings.read_text()
          if "com.google.gms.google-services" not in s:
              marker = re.search(r'(?m)^\s*id "org\.jetbrains\.kotlin\.android" version "[^"]+" apply false\s*$', s)
              if not marker:
                  raise SystemExit("Kotlin Gradle plugin declaration not found.")
              s = s[:marker.end()] + '\n    id "com.google.gms.google-services" version "4.4.2" apply false' + s[marker.end():]
          settings.write_text(s)

          a = app.read_text()
          if 'id "com.google.gms.google-services"' not in a:
              a = a.replace('id "dev.flutter.flutter-gradle-plugin"',
                            'id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"')
          if "coreLibraryDesugaringEnabled true" not in a:
              a = a.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
          if "coreLibraryDesugaring " not in a:
              a += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
          app.write_text(a)

          # Verify the Android application ID matches the Firebase client package.
          if 'applicationId "com.quranak.app"' not in a:
              raise SystemExit("Generated Android applicationId is not com.quranak.app.")
          PY

          echo "Project prepared:"
          find assets -maxdepth 3 -type f | sort | head -80
          echo "Android manifest and Firebase configuration restored."

      - name: Resolve Flutter dependencies
        working-directory: ${{ runner.temp }}/quranak-v6/Quranak_Complete_App_v6/quranak_flutter_app
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: ${{ runner.temp }}/quranak-v6/Quranak_Complete_App_v6/quranak_flutter_app
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ${{ runner.temp }}/quranak-v6/Quranak_Complete_App_v6/quranak_flutter_app
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Build attempt $attempt failed; retrying after a short pause."
            sleep 20
          done

      - name: Verify APK output
        working-directory: ${{ runner.temp }}/quranak-v6/Quranak_Complete_App_v6/quranak_flutter_app
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Quranak-v6-release-apk
          path: ${{ runner.temp }}/quranak-v6/Quranak_Complete_App_v6/quranak_flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
